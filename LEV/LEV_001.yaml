    en: "Levski - Lokomotiv Sofia (01.03.2026)"
  mainMedia: "https://levski.bg/main_01.mp4"
  description:
    bg: "<b>Левски</b> надстреля <b>Локомотив София</b> и го победи с 4:3 в седемголово зрелище на „Герена“ от 23 кръг на Първа лига. „Сините“ имат аванс от 13 точки на върха, но Лудогорец е с мач пасив. Срещата между Левски и Локо Сф видя два обрата, пропусната дузпа и нелеп автогол. Евертон Бала откри рано-рано, а Анте Аралица и Кауе Карузо обърнаха за „червено-черните“. Между двете попадения на гостите Аралица изпусна дузпа за „железничарите“, уловена от Светослав Вуцов. Оттам насетне Левски взе нещата в свои ръце, макар и подпомогнат от изключително нелеп автогол на Никола Нейчев за 2:2. Мустафа Сангаре с глава и Евертон Бала от дузпа донесоха трите точки за Хулио Веласкес и компания срещу неговия предшественик Станислав Генчев. Едва в края на мача Карузо вкара седмия гол в мача, оказал се почетен за неговия тим."
    en: "<b>Levski</b> outshot <b>Lokomotiv Sofia</b> and defeated them 4–3 in a seven-goal thriller at “Gerena” in the 23rd round of the First League. The Blues now have a 13-point lead at the top, although Ludogorets have a game in hand. The match between Levski and Loko Sofia featured two comebacks, a missed penalty, and a bizarre own goal. Everton Bala opened the scoring early, but Ante Aralica and Kaue Caruzo turned the game around for the red-and-blacks. Between the two goals for the visitors, Aralica missed a penalty for the “railwaymen,” which was saved by Svetoslav Vutsov. From that point on, Levski took control of the match, although they were helped by an extremely unfortunate own goal by Nikola Neychev to make it 2–2. Mustafa Sangaré scored with a header, and Everton Bala converted a penalty to secure the three points for Julio Velasquez and his team against his predecessor Stanislav Genchev. Near the very end of the match, Caruzo scored the seventh goal of the game, which proved to be only a consolation for his team."
